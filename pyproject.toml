[project]
name = "industrialllm"
version = "0.1.0"
description = "MaintIE ticket extraction with Qwen, LoRA and FastAPI"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.121.3", "pydantic==2.12.4", "uvicorn==0.38.0"]

[project.optional-dependencies]
cpu = ["torch==2.6.0+cpu"]
cuda = ["torch==2.6.0+cu124"]
model = ["transformers==4.57.6", "peft==0.18.0", "accelerate==1.12.0", "numpy==1.26.4"]
train = ["trl==0.26.2", "datasets==4.4.1", "pyarrow==22.0.0"]
report = ["pandas==2.3.3", "matplotlib==3.10.7"]
tracking = ["wandb==0.23.0"]

[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.14.6"]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [[{extra = "cpu"}, {extra = "cuda"}]]

[tool.uv.sources]
torch = [{index = "torch-cpu", extra = "cpu"}, {index = "torch-cu124", extra = "cuda"}]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 108

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
